version: '3.9'

services:
  # ──────────────────────────────────────────────
  # Base de datos PostgreSQL
  # ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: courses_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-courses_db}
      POSTGRES_USER: ${DB_USER:-courses_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-courses_password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ──────────────────────────────────────────────
  # Redis (Broker para Celery)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: courses_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
