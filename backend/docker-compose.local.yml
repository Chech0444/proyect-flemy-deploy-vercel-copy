version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: flemy_db_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: flemy
      POSTGRES_USER: flemy
      POSTGRES_PASSWORD: flemy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flemy_redis_local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data

volumes:
  postgres_data_local:
  redis_data_local:
