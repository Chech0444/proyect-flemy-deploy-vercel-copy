<div class="login-wrapper">
  <div class="grid-background"></div>
  <div class="particles"></div>
  
  <nav class="top-nav">
    <a class="logo" routerLink="/" aria-label="Flemy">
      <img src="logo.jpg" alt="Flemy" class="logo-mark">
      <span>Flemy</span>
    </a>
    <div class="nav-right">
      <span class="no-account-text">¿Ya tienes una cuenta?</span>
      <a routerLink="/login" class="register-btn">Iniciar Sesión</a>
    </div>
  </nav>

  <main class="login-container">
    <div class="login-header">
      <h1>Crea tu cuenta</h1>
      <p>Únete a Flemy y comienza a aprender con IA.</p>
    </div>

    <div class="login-card">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group half-width">
            <label>Nombre</label>
            <div class="input-wrapper">
              <input type="text" formControlName="first_name" placeholder="Tu nombre" required>
            </div>
          </div>

          <div class="form-group half-width">
            <label>Apellido</label>
            <div class="input-wrapper">
              <input type="text" formControlName="last_name" placeholder="Tu apellido" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Usuario</label>
          <div class="input-wrapper">
            <input type="text" formControlName="username" placeholder="tu_usuario" required>
          </div>
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <div class="input-wrapper">
            <input type="email" formControlName="email" placeholder="tu@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label>Contraseña</label>
          </div>
          <div class="input-wrapper">
            <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres" required>
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-msg">
          {{ errorMessage }}
        </div>
        
        <div *ngIf="successMessage" class="success-msg">
          {{ successMessage }}
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Registrarse</span>
          <span *ngIf="isLoading">Cargando...</span>
        </button>
      </form>
    </div>

    <footer class="login-footer">
      <a href="#">Política de Privacidad</a> | 
      <a href="#">Términos de Servicio</a> | 
      <a href="#">Centro de Ayuda</a>
    </footer>
  </main>
</div>
