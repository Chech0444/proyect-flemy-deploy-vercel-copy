<main class="login-wrapper">
  <div class="grid-background"></div>
  <div class="particles"></div>

  <nav class="top-nav" aria-label="Principal">
      <a class="logo" routerLink="/" aria-label="Flemy">
      <img src="logo.jpg" alt="Flemy" class="logo-mark">
      <span>Flemy</span>
    </a>

    <div class="nav-right">
      <span class="no-account-text">No tienes cuenta?</span>
      <a class="register-btn" routerLink="/register">Registrate</a>
    </div>
  </nav>

  <section class="login-container">
    <header class="login-header">
      <h1>Inicia sesion</h1>
      <p>Continua aprendiendo desde tu dashboard.</p>
    </header>

    <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="username">Usuario o correo</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true"></span>
          <input id="username" type="text" formControlName="username" autocomplete="username"
            placeholder="tu@email.com" />
        </div>
        <p class="field-error" *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">
          Ingresa tu usuario o correo.
        </p>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contrasena</label>
          <a class="forgot-password" routerLink="/forgot-password">Olvide mi contrasena</a>
        </div>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true"></span>
          <input id="password" type="password" formControlName="password" autocomplete="current-password"
            placeholder="Tu contrasena" />
        </div>
        <p class="field-error" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
          Ingresa tu contrasena.
        </p>
      </div>

      <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit-btn" type="submit" [disabled]="isLoading || socialLoading !== null">
        {{ isLoading ? 'Ingresando...' : 'Entrar' }}
      </button>

      <div class="divider"><span>o continua con</span></div>

      <div class="social-actions">
        <button type="button" class="social-btn" (click)="loginWithGoogle()"
          [disabled]="isLoading || socialLoading !== null">
          <span class="provider-icon google-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
          </span>
          <span>{{ socialLoading === 'google' ? 'Conectando...' : 'Continuar con Google' }}</span>
        </button>

        <button type="button" class="social-btn" (click)="loginWithGitHub()"
          [disabled]="isLoading || socialLoading !== null">
          <span class="provider-icon github-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.338c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </span>
          <span>{{ socialLoading === 'github' ? 'Conectando...' : 'Continuar con GitHub' }}</span>
        </button>
      </div>
    </form>
  </section>
</main>
