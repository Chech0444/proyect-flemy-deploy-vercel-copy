<main class="login-wrapper">
  <div class="grid-background"></div>
  <div class="particles"></div>

  <nav class="top-nav" aria-label="Principal">
    <a class="logo" routerLink="/login" aria-label="Flemy">
      <span class="logo-mark">F</span>
      <span>Flemy</span>
    </a>

    <div class="nav-right">
      <span class="no-account-text">No tienes cuenta?</span>
      <a class="register-btn" routerLink="/register">Registrate</a>
    </div>
  </nav>

  <section class="login-container">
    <header class="login-header">
      <h1>Inicia sesion</h1>
      <p>Continua aprendiendo desde tu dashboard.</p>
    </header>

    <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="social-actions">
        <button
          type="button"
          class="social-btn"
          (click)="loginWithGoogle()"
          [disabled]="isLoading || socialLoading !== null"
        >
          <span class="provider-icon google-icon">G</span>
          <span>{{ socialLoading === 'google' ? 'Conectando...' : 'Continuar con Google' }}</span>
        </button>

        <button
          type="button"
          class="social-btn"
          (click)="loginWithGitHub()"
          [disabled]="isLoading || socialLoading !== null"
        >
          <span class="provider-icon github-icon">GH</span>
          <span>{{ socialLoading === 'github' ? 'Conectando...' : 'Continuar con GitHub' }}</span>
        </button>
      </div>

      <div class="divider"><span>o usa tus credenciales</span></div>

      <div class="form-group">
        <label for="username">Usuario o correo</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">@</span>
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="tu@email.com"
          />
        </div>
        <p class="field-error" *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">
          Ingresa tu usuario o correo.
        </p>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contrasena</label>
          <a class="forgot-password" routerLink="/forgot-password">Olvide mi contrasena</a>
        </div>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">*</span>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Tu contrasena"
          />
        </div>
        <p class="field-error" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
          Ingresa tu contrasena.
        </p>
      </div>

      <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit-btn" type="submit" [disabled]="isLoading || socialLoading !== null">
        {{ isLoading ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
