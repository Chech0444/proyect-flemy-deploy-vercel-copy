<div class="page-wrapper" style="display:flex;">
  <div class="blob-bg blob-primary"></div>
  <div class="blob-bg blob-secondary"></div>

  <app-sidebar [userProfile]="userProfile" [isAdmin]="isAdmin"></app-sidebar>

  <main class="flex-1 overflow-x-hidden min-h-screen relative z-10 md:ml-64">
    <app-topbar [userProfile]="userProfile"></app-topbar>

    <div class="profile-container">
      <div class="profile-header">
        <h1 class="text-[2rem] md:text-[2.4rem] font-bold text-[#eff6ff] tracking-tight">Mi Perfil</h1>
        <p class="text-[#94a3b8] text-[0.95rem]">Gestiona tu informacion personal y preferencias de cuenta.</p>
      </div>

      <div *ngIf="isLoading" class="space-y-6 animate-pulse">
        <div class="glass-card h-80"></div>
        <div class="glass-card h-48"></div>
      </div>

      <div *ngIf="!isLoading" class="profile-content">

        <section class="glass-card profile-card">
          <div class="card-header">
            <div class="icon-box icon-sky">
              <span class="material-symbols-outlined">person</span>
            </div>
            <h2>Informacion Personal</h2>
          </div>

          <div class="card-body">
            <div class="account-info-body">
              <div class="avatar-edit-wrapper">
                <div class="avatar-big">
                  <img [src]="'https://ui-avatars.com/api/?name=' + (userProfile?.first_name || userProfile?.username || 'U') + '&background=0ea5e9&color=fff&size=128'" class="avatar-img" alt="Avatar">
                </div>
              </div>

              <div class="fields-grid">
              <div class="field-group">
                <label>Nombre</label>
                <input type="text" [(ngModel)]="userProfile.first_name" placeholder="Tu nombre" class="field-input">
              </div>
              <div class="field-group">
                <label>Apellido</label>
                <input type="text" [(ngModel)]="userProfile.last_name" placeholder="Tu apellido" class="field-input">
              </div>
              <div class="field-group col-span-2">
                <label>Nombre de Usuario</label>
                <input type="text" [(ngModel)]="userProfile.username" disabled="true" class="field-input field-disabled">
              </div>
              <div class="field-group col-span-2">
                <label>Correo Electronico</label>
                <input type="email" [value]="userProfile.email" disabled="true" class="field-input field-disabled">
              </div>
            </div>

            <div class="field-group">
              <label>Biografia</label>
              <textarea [(ngModel)]="userProfile.bio" placeholder="Cuentanos sobre ti..." rows="3" class="field-input"></textarea>
            </div>
            </div>
          </div>
        </section>

        <section class="glass-card password-card">
          <div class="card-header">
            <div class="icon-box icon-purple">
              <span class="material-symbols-outlined">lock</span>
            </div>
            <h2>Seguridad</h2>
          </div>

          <div class="card-body">
            <button class="btn-password" (click)="openPasswordModal()">
              <span class="material-symbols-outlined">key</span>
              Cambiar Contrasena
            </button>

            <div class="delete-account">
              <button class="btn-delete" (click)="deleteAccount()" [disabled]="isDeletingAccount">
                <span class="material-symbols-outlined">delete_forever</span>
                {{ isDeletingAccount ? 'Eliminando...' : 'Eliminar Cuenta' }}
              </button>
            </div>
          </div>
        </section>

      </div>

      <div *ngIf="!isLoading" class="save-bar">
        <div *ngIf="saveSuccess" class="save-toast">
          <span class="material-symbols-outlined">check_circle</span>
          Perfil Guardado Exitosamente
        </div>

        <button class="btn-save" (click)="saveProfile()" [disabled]="isSaving">
          <span *ngIf="isSaving" class="material-symbols-outlined animate-spin">progress_activity</span>
          {{ isSaving ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" *ngIf="showPasswordModal" (click)="closePasswordModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Cambiar Contrasena</h3>
      <span class="material-symbols-outlined close-btn" (click)="closePasswordModal()">close</span>
    </div>

    <div class="modal-body">
      <div class="field-group">
        <label>Contrasena Actual</label>
        <input type="password" [(ngModel)]="oldPassword" placeholder="Tu contrasena actual" class="field-input">
      </div>
      <div class="field-group">
        <label>Nueva Contrasena</label>
        <input type="password" [(ngModel)]="newPassword" placeholder="Min. 8 caracteres" class="field-input">
      </div>
      <div class="field-group">
        <label>Confirmar Contrasena</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Repite la contrasena" class="field-input">
      </div>
      <p *ngIf="passwordError" class="error-msg">{{ passwordError }}</p>
      <p *ngIf="passwordSuccess" class="success-msg">Contrasena actualizada exitosamente.</p>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closePasswordModal()">Cancelar</button>
      <button class="btn-save" (click)="changePassword()" [disabled]="isSavingPassword">
        {{ isSavingPassword ? 'Actualizando...' : 'Actualizar Contrasena' }}
      </button>
    </div>
  </div>
</div>
