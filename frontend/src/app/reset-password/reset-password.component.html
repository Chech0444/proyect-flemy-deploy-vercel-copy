<div class="auth-wrapper">
  <!-- Blobs -->
  <div class="blob-bg blob-primary"></div>
  <div class="blob-bg blob-secondary"></div>

  <!-- Formulario -->
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logobox">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>
      <h2>Establecer nueva contraseña</h2>
      <p>Crea una nueva contraseña para tu cuenta usando este enlace seguro.</p>
    </div>

    <!-- Mensajes de info -->
    <div *ngIf="successMessage" class="alert alert-success">
      <span class="material-symbols-outlined">check_circle</span>
      {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-error">
      <span class="material-symbols-outlined">error</span>
      {{ errorMessage }}
    </div>

    <form *ngIf="!successMessage" (ngSubmit)="onSubmit()" #resetForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="new_password">Nueva Contraseña</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input 
            type="password" 
            id="new_password" 
            name="newPassword" 
            [(ngModel)]="newPassword" 
            required 
            placeholder="Mínimo 8 caracteres"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirmar Contraseña</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">lock_clock</span>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            required 
            placeholder="Confirma la contraseña"
          >
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="!resetForm.form.valid || isLoading">
        <ng-container *ngIf="!isLoading">Cambiar Contraseña</ng-container>
        <ng-container *ngIf="isLoading">
          <span class="material-symbols-outlined animate-spin text-sm mr-2">progress_activity</span>
          Verificando...
        </ng-container>
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Recordaste tu contraseña antigua? <a routerLink="/login">Inicia Sesión</a></p>
    </div>
  </div>
</div>
