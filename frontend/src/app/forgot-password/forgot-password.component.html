<div class="auth-wrapper">
  <!-- Blobs -->
  <div class="blob-bg blob-primary"></div>
  <div class="blob-bg blob-secondary"></div>

  <!-- Formulario -->
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logobox">
        <span class="material-symbols-outlined">auto_awesome</span>
      </div>
      <h2>Recuperar Contraseña</h2>
      <p>Introduce tu correo para restablecer tu cuenta.</p>
    </div>

    <!-- Mensajes de info -->
    <div *ngIf="successMessage" class="alert alert-success">
      <span class="material-symbols-outlined">check_circle</span>
      {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-error">
      <span class="material-symbols-outlined">error</span>
      {{ errorMessage }}
    </div>

    <form *ngIf="!successMessage" (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email" 
            required 
            placeholder="estudiante@ejemplo.com"
          >
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="!forgotForm.form.valid || isLoading">
        <ng-container *ngIf="!isLoading">Enviar enlace mágico</ng-container>
        <ng-container *ngIf="isLoading">
          <span class="material-symbols-outlined animate-spin text-sm mr-2">progress_activity</span>
          Enviando...
        </ng-container>
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Recordaste tu contraseña? <a routerLink="/login">Inicia Sesión</a></p>
    </div>
  </div>
</div>
